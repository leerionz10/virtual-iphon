<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10121a">
<title>Virtual iPhone · iOS Style</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="phone" class="phone">
  <div class="wallpaper" id="wallpaper"></div>
  <div class="dynamic-island" aria-hidden="true"><span class="island-camera"></span></div>
  <div class="statusbar">
    <button id="statusTime" class="status-time" aria-label="잠금 화면">9:41</button>
    <div class="status-icons"><span>●●●</span><span>⌁</span><span class="battery"><i></i></span></div>
  </div>
  <div id="lockScreen" class="lock-screen">
    <div class="lock-date" id="lockDate">화요일, 10월 20일</div>
    <div class="lock-clock" id="lockClock">9:41</div>
    <div class="lock-notifications" id="lockNotifications"></div>
    <div class="lock-bottom"><button id="flashBtn" class="round-tool" aria-label="손전등">⌁</button><span class="swipe-hint">위로 쓸어올려 열기</span><button id="cameraBtn" class="round-tool" aria-label="카메라">◎</button></div>
  </div>
  <main id="mainUI" class="main-ui hidden">
    <header class="home-greeting"><div><div class="eyebrow">TUESDAY, OCTOBER 20</div><h1 id="homeTitle">좋은 하루예요</h1></div><button class="profile-dot" data-app="settings">☻</button></header>
    <div id="homeNotifications" class="home-notifications"></div>
    <section class="app-grid" id="appGrid">
      <button class="app-icon" data-app="messages"><span class="glyph green">💬</span><small>메시지</small></button>
      <button class="app-icon" data-app="contacts"><span class="glyph silver">👤</span><small>연락처</small></button>
      <button class="app-icon" data-app="photos"><span class="glyph photo-glyph">🌈</span><small>사진</small></button>
      <button class="app-icon" data-app="notes"><span class="glyph yellow">📝</span><small>메모</small></button>
      <button class="app-icon" data-app="calculator"><span class="glyph dark">🧮</span><small>계산기</small></button>
      <button class="app-icon" data-app="clock"><span class="glyph silver">🕒</span><small>시계</small></button>
      <button class="app-icon" data-app="settings"><span class="glyph gray">⚙️</span><small>설정</small></button>
      <button class="app-icon" data-app="browser"><span class="glyph blue">🧭</span><small>브라우저</small></button>
    </section>
    <section class="widget-row">
      <button class="widget weather" data-app="settings"><span class="widget-label">오늘의 날씨</span><strong>☀  21°</strong><small>맑음 · 예시 정보</small></button>
      <button class="widget battery-widget" data-app="settings"><span class="widget-label">기기 상태</span><strong>▰  100%</strong><small>가상 배터리</small></button>
    </section>
    <nav class="dock">
      <button class="dock-icon dock-messages" data-app="messages" aria-label="메시지">💬</button>
      <button class="dock-icon dock-browser" data-app="browser" aria-label="브라우저">🧭</button>
      <button class="dock-icon dock-photos" data-app="photos" aria-label="사진">🌈</button>
      <button class="dock-icon dock-settings" data-app="settings" aria-label="설정">⚙️</button>
    </nav>
  </main>
  <section id="appWindow" class="app-window hidden">
    <div class="app-topbar"><button id="backHome" class="back-button">‹ 홈</button><strong id="appTitle">메시지</strong><button id="appAction" class="top-action">＋</button></div>
    <div id="appContent" class="app-content"></div>
  </section>
  <div id="controlCenter" class="control-center hidden">
    <div class="cc-handle"></div><div class="cc-header"><strong>제어 센터</strong><button id="closeCC">완료</button></div>
    <div class="cc-grid">
      <button class="cc-toggle active" data-toggle="airplane">✈<span>비행기 모드</span></button>
      <button class="cc-toggle active" data-toggle="wifi">⌁<span>Wi‑Fi</span></button>
      <button class="cc-toggle" data-toggle="bluetooth">ᛒ<span>Bluetooth</span></button>
      <button class="cc-toggle active" data-toggle="focus">☾<span>집중 모드</span></button>
    </div>
    <label class="range-label">☼ 화면 밝기 <input id="brightness" type="range" min="45" max="100" value="100"></label>
    <label class="range-label">♫ 볼륨 <input id="volume" type="range" min="0" max="100" value="65"></label>
    <button id="ccNotify" class="wide-button">알림 센터 보기</button>
  </div>
  <div id="notificationBanner" class="notification-banner hidden"></div>
  <div id="toast" class="toast hidden"></div>
  <div class="home-indicator" id="homeIndicator"></div>
</div>
<script src="app.js"></script>
</body>
</html>
